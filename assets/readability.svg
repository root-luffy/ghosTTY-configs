<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Brightness cap versus worst-case text contrast: lower caps give dimmer wallpapers and more readable text">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171430"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5d8f"/><stop offset="0.45" stop-color="#bb9af7"/><stop offset="1" stop-color="#7dcfff"/></linearGradient></defs>
<rect width="1200" height="620" rx="20" fill="url(#bg)"/>
<text x="48" y="62" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6ebff">Cap the brightness, and the contrast is guaranteed</text>
<text x="48" y="96" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#a9b1d6">No pixel of the baked plate may exceed the cap, so the worst case for text (#c8d3f5) is known before Ghostty draws a frame.</text>
<text x="48" y="134" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6f7aa6" letter-spacing="1.5">--cap</text>
<text x="150" y="134" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6f7aa6" letter-spacing="1.5">BRIGHTEST PIXEL</text>
<text x="420" y="134" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6f7aa6" letter-spacing="1.5">WORST-CASE TEXT CONTRAST</text>
<line x1="699.0" y1="146" x2="699.0" y2="550" stroke="#9ece6a" stroke-width="2" stroke-dasharray="5 5"/>
